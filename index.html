<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Web Page with JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .dark-mode {
      background-color: #222;
      color: #eee;
    }

    .faq-answer {
      display: none;
      margin: 5px 0 15px;
    }

    .error {
      color: red;
      font-size: 14px;
    }
    .success {
      color: green;
      font-size: 14px;
    }

    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1> Interactive Web Page with JavaScript</h1>

  <!-- Part 1: Event Handling -->
  <button id="messageBtn">Click Me!</button>
  <p id="message"></p>

  <!-- Part 2: Interactive Elements -->
  <section>
    <h2> Interactive Elements</h2>
    
    <!-- Light/Dark Mode -->
    <button id="toggleTheme">Toggle Light/Dark Mode</button>
    
    <!-- Counter -->
    <div>
      <button id="decrease">-</button>
      <span id="counter">0</span>
      <button id="increase">+</button>
    </div>

    <!-- Collapsible FAQ -->
    <h3 class="faq-question" style="cursor:pointer;">What is JavaScript? (Click me)</h3>
    <p class="faq-answer">JavaScript is a programming language used to make web pages interactive.</p>
  </section>

  <!-- Part 3: Form Validation -->
  <section>
    <h2> Form Validation</h2>
    <form id="signupForm">
      <label>Name: <input type="text" id="name"></label><br><br>
      <label>Email: <input type="text" id="email"></label><br><br>
      <label>Password: <input type="password" id="password"></label><br><br>
      <button type="submit">Sign Up</button>
    </form>
    <p id="formMessage"></p>
  </section>

  <script>
    // PART 1: Event Handling
    document.getElementById("messageBtn").addEventListener("click", () => {
      document.getElementById("message").textContent = "🎉 You clicked the button!";
    });

    // PART 2: Interactive Elements

    // 1. Light/Dark Mode Toggle
    document.getElementById("toggleTheme").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    // 2. Counter
    let count = 0;
    document.getElementById("increase").addEventListener("click", () => {
      count++;
      document.getElementById("counter").textContent = count;
    });
    document.getElementById("decrease").addEventListener("click", () => {
      count--;
      document.getElementById("counter").textContent = count;
    });

    // 3. Collapsible FAQ
    document.querySelector(".faq-question").addEventListener("click", () => {
      const answer = document.querySelector(".faq-answer");
      answer.style.display = (answer.style.display === "block") ? "none" : "block";
    });

    // PART 3: Form Validation
    document.getElementById("signupForm").addEventListener("submit", (event) => {
      event.preventDefault(); // prevent form from refreshing the page

      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();
      let message = "";

      // Name validation
      if (name.length < 3) {
        message = "❌ Name must be at least 3 characters.";
      }
      // Email validation (basic regex)
      else if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
        message = "❌ Please enter a valid email.";
      }
      // Password validation (at least 6 characters, one number)
      else if (!/^(?=.*\\d).{6,}$/.test(password)) {
        message = "❌ Password must be at least 6 characters and contain a number.";
      }
      else {
        message = "✅ Form submitted successfully!";
        document.getElementById("signupForm").reset();
      }

      // Display message
      let formMessage = document.getElementById("formMessage");
      formMessage.textContent = message;
      formMessage.className = message.startsWith("✅") ? "success" : "error";
    });
  </script>
</body>
</html>
